openapi: 3.0.3
info:
  title: Soccer League API
  version: "1"
  description: >
    Receives stadium attendance and ticket sales events
    from soccer stadiums in the league
paths:
  /stadiums/attendance:
    get:
      summary: Get attendance events
      operationId: storage.get_attendance_events
      description: Returns attendance events recorded after a specified timestamp
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: string
            format: date-time
          description: Return only events recorded after this timestamp
      responses:
        '200':
          description: List of attendance events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceEvent'
    post:
      summary: Receive a stadium attendance event
      description: Records the current attendance at a stadium.
      operationId: storage.store_attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceEvent'
      responses:
        '201':
          description: Attendance event successfully received
        '400':
          description: Invalid attendance event
  /stadiums/ticket-sales:
    get:
      summary: Get ticket sale events
      operationId: storage.get_ticket_sale_events
      description: Returns ticket sale events recorded after a specified timestamp
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: string
            format: date-time
          description: Return only events recorded after this timestamp
      responses:
        '200':
          description: List of ticket sale events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSaleEvent'
    post:
      summary: Receive a ticket sales event
      description: Records a ticket sales transaction for a stadium.
      operationId: storage.store_ticket_sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketSaleEvent'
      responses:
        '201':
          description: Ticket sales event successfully received
        '400':
          description: Invalid ticket sales event
  /status:
    get:
      summary: Check storage service status
      operationId: storage.get_status
      responses:
        '200':
          description: Storage service is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - attendance_count
                  - ticket_sale_count
                properties:
                  status:
                    type: string
                    example: running
                  attendance_count:
                    type: integer
                    example: 31
                  ticket_sale_count:
                    type: integer
                    example: 25
        '500':
          description: Storage service is not operating correctly
  /reset:
    post:
      summary: Reset the storage database
      operationId: storage.reset_database
      responses:
        '200':
          description: Database successfully reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Database reset successfully
        '500':
          description: Database reset failed
components:
  schemas:
    AttendanceEvent:
      type: object
      additionalProperties: false
      required:
        - stadium_id
        - attendance
        - capacity
        - timestamp
        - trace_id
      properties:
        stadium_id:
          type: string
          example: "STAD-1"
        attendance:
          type: integer
          minimum: 0
          example: 32500
        capacity:
          type: integer
          minimum: 1
          example: 40000
        timestamp:
          type: string
          format: date-time
          example: "2026-09-15T19:30:00Z"
        trace_id:
          type: integer
          format: int64
          example: 1791401234567890000
        recorded_timestamp:
          type: string
          format: date-time
          example: "2026-10-14T04:30:25.987654Z"
    TicketSaleEvent:
      type: object
      additionalProperties: false
      required:
        - stadium_id
        - tickets_sold
        - ticket_price
        - timestamp
        - trace_id
      properties:
        stadium_id:
          type: string
          example: "STAD-1"
        tickets_sold:
          type: integer
          minimum: 1
          example: 4
        ticket_price:
          type: number
          format: float
          minimum: 0
          example: 75.00
        timestamp:
          type: string
          format: date-time
          example: "2026-09-15T14:25:00Z"
        trace_id:
          type: integer
          format: int64
          example: 1791401234567890000
        recorded_timestamp:
          type: string
          format: date-time
          example: "2026-10-14T04:30:25.987654Z"
          