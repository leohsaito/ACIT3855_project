version: 1

formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: simple
    filename: app.log

loggers:
  uvicorn:
    level: WARNING
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false

  connexion:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: DEBUG
  handlers: [console, file]

disable_existing_loggers: false