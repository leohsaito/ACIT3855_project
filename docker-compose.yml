services:

  db:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: soccer_events
      MYSQL_USER: soccer_user
      MYSQL_PASSWORD: soccer_password
      TZ: America/Vancouver

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-usoccer_user",
          "-psoccer_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # Reads from MySQL and provides GET endpoints to processing.
  storage:
    build:
      context: ./storage
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: mysql+pymysql://soccer_user:soccer_password@db:3306/soccer_events

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/status"]
      interval: 5s
      timeout: 2s
      retries: 5


  # Receives events from Redpanda and writes them to MySQL.
  storage-worker:
    build:
      context: ./storage
      dockerfile: Dockerfile.worker

    environment:
      DATABASE_URL: mysql+pymysql://soccer_user:soccer_password@db:3306/soccer_events
      KAFKA_BROKER: redpanda:9092
      KAFKA_ATTENDANCE_TOPIC: stadium-attendance
      KAFKA_TICKET_TOPIC: ticket-sales

    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started


  receiver:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_ATTENDANCE_TOPIC: stadium-attendance
      KAFKA_TICKET_TOPIC: ticket-sales

    # Receiver no longer talks directly to storage.
    depends_on:
      redpanda:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 5s
      timeout: 2s
      retries: 5


  processing:
    build:
      context: ./processing
      dockerfile: Dockerfile

    environment:
      STORAGE_URL: http://storage:8090
      POLL_INTERVAL: "5"
      STATS_FILE: /data/statistics.json

    volumes:
      - processing_data:/data

    depends_on:
      storage:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/status"]
      interval: 5s
      timeout: 2s
      retries: 5


  redpanda:
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
      - --set
      - redpanda.auto_create_topics_enabled=true

    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10

    volumes:
      - redpanda:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.4

    entrypoint: /bin/sh

    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'

    environment:
      CONFIG_FILEPATH: /tmp/config.yml

      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
        server:
          basePath: /redpanda
          setBasePathFromXForwardedPrefix: false
          stripPrefix: true

    depends_on:
      - redpanda

  prometheus:
    image: prom/prometheus:latest

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=http://localhost:8088/prometheus/"
      - "--web.route-prefix=/prometheus"

    # ports:
    #  - "9090:9090"

    depends_on:
      - redpanda

  loki:
    image: grafana/loki:latest

  alloy:
    image: grafana/alloy:latest

    # ports:
    #  - "12345:12345"

    volumes:
      - ./prometheus/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    depends_on:
      - loki
    
  grafana:
    image: grafana/grafana:13.1.3

    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_PASSWORD=password
      - GF_SERVER_ROOT_URL=http://localhost:8088/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

    volumes:
      - grafana-storage:/var/lib/grafana

    depends_on:
      - prometheus
      - loki
  
  caddy:
    image: caddy:2-alpine

    ports:
      - "8088:80"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - receiver
      - storage
      - processing
      - grafana
      - redpanda-console

volumes:
  mysql_data:
  processing_data:
  redpanda:
  grafana-storage:
  caddy_data:
  caddy_config: